name: Tes izin
on: workflow_dispatch
jobs:
  tes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod -R a+rwX .
      - run: |
          ./scripts/run-docker.sh bash -c 'cd /home/builder/termux-packages; for d in . output scripts packages; do if touch $d/.tes 2>/dev/null; then echo "$d: BISA"; rm $d/.tes; else echo "$d: DITOLAK"; fi; done'
