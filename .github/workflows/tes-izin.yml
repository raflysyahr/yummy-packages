name: Tes izin
on: workflow_dispatch
jobs:
  tes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod -R a+rwX .
      - run: |
        mkdir -p output
          chmod -R a+rwX .
          ./scripts/run-docker.sh bash -c 'touch /home/builder/termux-packages/bootstrap-aarch64.zip; touch /home/builder/termux-packages/output/.tes; touch /home/builder/.tes; touch /tmp/.tes; echo selesai' || true
          sudo dmesg | grep -i 'apparmor="DENIED"' | tail -n 20


