name: Build bootstrap
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Izinkan container menulis
        run: chmod -R a+rwX .

      - run: ./scripts/run-docker.sh ./build-package.sh -a aarch64 libbz2
      - run: ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap
          path: bootstrap-*.zip
          if-no-files-found: error
