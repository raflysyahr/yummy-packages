name: Build bootstrap
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - run: mkdir -p output
      - name: Cek izin output
        run: ./scripts/run-docker.sh bash -c 'touch /home/builder/termux-packages/output/.tes && rm /home/builder/termux-packages/output/.tes && echo OUTPUT_BISA'
      - run: ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap
          path: output/bootstrap-aarch64.zip
          if-no-files-found: error
